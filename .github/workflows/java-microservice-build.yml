name: CaseMaintenanceUI
#test
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Input Version (Major.Minor)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SAMI_BAMS_ACCOUNT_NAME: ${{ secrets.SAMI_BAMS_ACCOUNT_NAME }}
      SAMI_BAMS_API_TOKEN: ${{ secrets.SAMI_BAMS_API_TOKEN }}
      ENTITLEMENT_JKS_FILE_PASSWORD: 'key-store-password'
      ENV_CONFIG_FILE: ".github/env-variables.txt"
      
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set environment variables defined in the ENV_CONFIG_FILE
        shell: bash
        run: |
          set -e  # Stop on error
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ ! "$line" =~ ^# && "$line" =~ = ]]; then
              echo "$line" >> $GITHUB_ENV
            fi
          done < ${{ env.ENV_CONFIG_FILE }}

          
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: List env vars
        shell: bash
        run: |
          printenv  

      - name: Install dependencies and Build
        run: |
          npm install
          npm run build -- --base-href "/caseMaintenance/" --project=CaseMaintenanceUI
        working-directory: ./CaseMaintenanceUI

      - name: Copy build output
        run: |
          cp -r ./dist/case-maintenance-ui/browser/* ./dist/
          rm -rf ./dist/case-maintenance-ui/browser
        working-directory: ./CaseMaintenanceUI

      - name: Archive production artifacts
        run: tar -czvf CaseMaintenanceUI.tar.gz ./dist
        working-directory: ./CaseMaintenanceUI
        
      - name: Create Release and Upload Artifacts
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.SCM_GITTOKEN }}
          body: "Release of version v${{ github.event.inputs.version }}.${{ github.run_number }}"
          draft: false
          generateReleaseNotes: true
          name: ${{ github.event.inputs.version }}.${{ github.run_number }}
          prerelease: false
          tag: ${{ github.event.inputs.version }}.${{ github.run_number }}
          artifacts: ./CaseMaintenanceUI/CaseMaintenanceUI.tar.gz
          allowUpdates: true
          replacesArtifacts: true 

      - name: Upload artifacts
        uses: actions/upload-artifact@v2
        with:
          name: ${{ github.event.inputs.version }}.${{ github.run_number }}
          path: |
           ./CaseMaintenanceUI/CaseMaintenanceUI.tar.gz
          retention-days: 1  

      - name: Setup Jfrog CLI
        uses: jfrog/setup-jfrog-cli@v3
          
      - name: Upload artifacts to Jfrog
        run: |
            jfrog rt u "./CaseMaintenanceUI/CaseMaintenanceUI.tar.gz" generic-local/SCM-Publishing/BuildArtifacts/CasesJ3/CaseMaintenance/CaseMaintenanceUI-Dev-Build/${{ github.event.inputs.version }}.${{ github.run_number }}/ --url="https://tr1.jfrog.io/artifactory" --user=${{ secrets.SCM_JFROG_ACCOUNT_NAME }} --password=${{ secrets.SCM_JFROG_API_TOKEN }}

      - name: Cleanup after build
        run: rm -rf ./CaseMaintenanceUI/dist
