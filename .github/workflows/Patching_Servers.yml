name: PatchScheduleCalculationWithSendemail

on:
  workflow_dispatch:
  schedule:
    - cron: '00 9 * * *' #UTC time
    
jobs:
  calculate-diff:
    runs-on:  [ Bermuda-2 ]
    outputs:
      trigger_email: ${{ steps.calculate-runtime.outputs.trigger_email }}
      trigger_stop_app: ${{ steps.calculate-runtime.outputs.trigger_stop_app }}
      env_name: ${{ steps.env_output.outputs.env_name }}

    strategy:
      matrix:
        environment: ['Test']
    
    steps:
      # - name: Checkout Repository
      #   uses: actions/checkout@v3
     

      - name: Run Custom Action from WestTech_SCM
        id: calculate-diffs
        uses: tr/ContentSCM_Actions/.github/actions/GetPatchCountdown@main
        with:
          patchProfile: M-08-09-25
          
      - name: Output Environment
        id: env_output
        run: echo "env_name=${{ matrix.environment }}" >> $GITHUB_OUTPUT

      - name: Display Calculated Time Differences
        shell: bash
        run: |
          echo "$(date +"%H:%M:%S") DaysUntilPatch: ${{ env.dayDiff }}"
          echo "$(date +"%H:%M:%S") HoursUntilPatch: ${{ env.hourDiff }}"
          echo "$(date +"%H:%M:%S") MinutesUntilPatch: ${{ env.minuteDiff }}"
          echo "$(date +"%H:%M:%S") SecondsUntilPatch: ${{ env.secondDiff }}"
          echo "$(date +"%H:%M:%S") MillisUntilPatch: ${{ env.milliDiff }}"
      
      - name: Calculate exact stop/start time
        id: calculate-runtime
        shell: bash
        run: |
          total_seconds=${{ env.secondDiff }}
          echo "Total remaining seconds: $total_seconds"
          if [ $total_seconds -lt 172800 ] && [ $total_seconds -gt 86400 ]; then
            echo "trigger_email=true" >> $GITHUB_OUTPUT
          elif [ $total_seconds -lt 86400 ]; then
            echo "trigger_stop_app=true" >> $GITHUB_OUTPUT
            echo "trigger_email=true" >> $GITHUB_OUTPUT
          else
            echo "trigger_stop_app=false" >> $GITHUB_OUTPUT
          fi  # Properly close the if block

  check_email_trigger:
    needs: [calculate-diff]
    if: ${{ needs.calculate-diff.outputs.trigger_email == 'true' }}
    uses: tr/ContentSCM_Actions/.github/workflows/SCM-Notify.yaml@main
    with:
       MAILSUBJECT: "Patching email Notification"
       MAILTO: "mahesh.t@thomsonreuters.com"
       MAILBODY: "Today is Patching Day (Monthly patching servers) for Test environment beginning at 9:30 AM UTC and email notification will be sent out with each activity"
    secrets:  
      scm_token: ${{ secrets.SCM_GITTOKEN }}
       

  trigger_delayed_workflow:
    needs: [calculate-diff, check_email_trigger]
    if: ${{ needs.calculate-diff.outputs.trigger_stop_app == 'true' }}
    uses: tr/ContentSCM_Actions/.github/workflows/delayednew_trigger.yml@main  
    with:
      scm_runtime: "09:28"
      scm_day_offset: "0"
      scm_job: "FormatterService-Dev-Test-StopStart.yaml"
      scm_repository: "Judicial_FormatterService"
      scm_ref: "java-cicd-workflows_1718954627"
      scm_parameters: ${{ format('environment={0}&operation=stop', needs.calculate-diff.outputs.env_name) }}
    secrets:  
     scm_token: ${{ secrets.SCM_GITTOKEN }}

  trigger_delayed_workflow2:
    needs: [calculate-diff, trigger_delayed_workflow]
    if: ${{ needs.calculate-diff.outputs.trigger_stop_app == 'true' }}
    uses: tr/ContentSCM_Actions/.github/workflows/delayednew_trigger.yml@main  # Reference reusable workflow at the top-level job
    with:
      scm_runtime: "11:30"
      scm_day_offset: "0"
      scm_job: "FormatterService-Dev-Test-StopStart.yaml"
      scm_repository: "Judicial_FormatterService"
      scm_ref: "java-cicd-workflows_1718954627"
      scm_parameters: ${{ format('environment={0}&operation=start', needs.calculate-diff.outputs.env_name) }}
    secrets:  
       scm_token: ${{ secrets.SCM_GITTOKEN }}
