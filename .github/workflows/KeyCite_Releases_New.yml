name: KeyCite-Releases-New

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Enter Environment'
        required: true

jobs:
  process-applications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Checkout WestLaw_Cody Repository
        uses: actions/checkout@v4
        with:
          repository: tr/WestLaw_Cody
          token: ${{ secrets.SCM_GITTOKEN }}
          path: ${{ github.workspace }}/WestLaw_Cody

      - name: List the files
        run: ls -alR

      - name: Set up Java and Groovy
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Install Groovy
        run: sudo apt-get install -y groovy

      - name: Parse Release XML
        run: groovy .github/parse_release.groovy ${{ github.workspace }}/WestLaw_Cody/Releases/Dev/KeyCiteReleasesApps.xml

      - name: Trigger Application Workflows
        run: |
          echo "Reading apps.properties..."
          apps=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^=]+)=true$ ]]; then
              app=${BASH_REMATCH[1]}
              apps="${apps},$app"
            fi
          done < apps.properties
          apps=${apps#,}
          echo "Applications to process: $apps"
          IFS=',' read -r -a appArray <<< "$apps"

          # Initialize a variable to track failures
          overall_status=0
          
          # Loop through each application and trigger the corresponding repository workflow
          for app in "${appArray[@]}"; do
            echo "Processing $app..."
            repo=$(grep "^$app=" .github/config/apps-to-repos.properties | cut -d'=' -f2)
            version=$(grep "^${app}_version=" apps.properties | cut -d'=' -f2)
            echo version=$version
          
            if [[ -z "$repo" ]]; then
              echo "Repository not found for application $app. Skipping..."
              continue
            fi
          
            # Trigger the workflow and fetch the corresponding run_id
            echo "Triggering workflow for $app in repository $repo..."
            trigger_response=$(curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/$repo/actions/workflows/${app}-Dev-Test-QA-Deploy.yml/dispatches \
              -d '{"ref": "main", "inputs": {"environment": "'"${{ github.event.inputs.environment }}"'", "build_ver": "'"$version"'"}}')
          
            if [[ $? -ne 0 ]]; then
              echo "Failed to trigger workflow for $app. Skipping..."
              overall_status=1
              continue
            fi
          
            # Allow some time for the workflow run to register
            echo "Waiting for workflow to register..."
            sleep 10
          
            # Fetch the run_id for the triggered workflow
            run_id=$(curl -s -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$repo/actions/runs?branch=main | jq -r \
              '.workflow_runs[] | select(.event == "workflow_dispatch" and .head_branch == "main") | .id' | head -n 1)
          
            if [[ -z "$run_id" ]]; then
              echo "Failed to retrieve run ID for $app. Skipping..."
              overall_status=1
              continue
            fi
          
            echo "Monitoring workflow run ID: $run_id for $app."
          
            # Monitor the status of the triggered workflow
            timeout=1800
            start_time=$(date +%s)
            last_status=""
            while true; do
              current_time=$(date +%s)
              elapsed_time=$((current_time - start_time))
          
              if [[ $elapsed_time -ge $timeout ]]; then
                echo "Timeout reached for $app. Marking as failed."
                overall_status=1
                break
              fi
          
              # Check the status of the workflow run
              status=$(curl -s -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$repo/actions/runs/$run_id | jq -r '.status')
          
              conclusion=$(curl -s -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$repo/actions/runs/$run_id | jq -r '.conclusion')

                 # Print status only if it changes
                if [[ "$status" != "$last_status" ]]; then
                  echo "Current status for $app: $status"
                  last_status="$status"
                fi
          
              if [[ "$status" == "queued" ]]; then
                echo "Workflow is queued for $app. Waiting for a runner to pick it up..."
              elif [[ "$status" == "completed" ]]; then
                echo "Workflow for $app completed with conclusion: $conclusion"
                if [[ "$conclusion" != "success" ]]; then
                  echo "Child workflow failed for $app with conclusion: $conclusion"
                  overall_status=1
                else
                  echo "Child workflow succeeded for $app."
                fi
                break
              elif [[ "$status" != "queued" && "$status" != "in_progress" ]]; then
                echo "Unexpected status: $status. Retrying..."
              fi
              sleep 15
            done
          done
          
          # Exit with the overall status
          exit $overall_status
