name: Trigger Application Workflows Across Repositories

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build for applications'
        required: true

jobs:
  process-applications:
    runs-on: ubuntu-latest

    steps:
      # Checkout the current repository
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      # Fetch release.xml from WestLaw_Cody repository
      - name: Checkout WestLaw_Cody Repository
        uses: actions/checkout@v4
        with:
          repository: tr/WestLaw_Cody
          token: ${{ secrets.SCM_GITTOKEN }}
          path: ${{ github.workspace }}/WestLaw_Cody

      - name: list the files
        run: |
           ls -alR
          

      # Set up Groovy
      - name: Set up Groovy
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'
          
      - name: Install Groovy
        run: sudo apt-get install -y groovy

      # Run Groovy script to generate apps.properties
      - name: Parse  WestLaw_Cody/CodeFreeze/ReleaseJenkins.xml
        run: groovy .github/parse_release.groovy ${{ github.workspace }}/WestLaw_Cody/Releases/CodeFreeze/ReleaseJenkins.xml

      # Create application-to-repository map
      - name: Create App-Repository Map
        id: create-map
        run: |
          cat <<EOF > apps-to-repos.properties
          Audits3=tr/Audits3Repo
          BTS=tr/BTSRepo
          CodesBenchNavigatorUI=tr/CodesBenchNavigatorUIRepo
          CodesBenchNavigator=tr/CodesBenchNavigatorRepo
          # Add all app-to-repo mappings here
          EOF

      # Read apps.properties and apps-to-repos.properties to trigger workflow
      - name: Trigger Application Workflows
        run: |
          # Read all applications from apps.properties
          echo "Reading apps.properties..."
          apps=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^=]+)=true$ ]]; then
              app=${BASH_REMATCH[1]}
              apps="${apps},$app"
            fi
          done < apps.properties
          apps=${apps#,}

          echo "Applications to process: $apps"
          IFS=',' read -r -a appArray <<< "$apps"

          # Loop through each application and trigger corresponding repository workflow
          for app in "${appArray[@]}"; do
            echo "Processing $app..."
            repo=$(grep "^$app=" apps-to-repos.properties | cut -d'=' -f2)
            if [[ -z "$repo" ]]; then
              echo "Repository not found for application $app. Skipping..."
              continue
            fi

            echo "Triggering workflow for $app in repository $repo"
            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/$repo/actions/workflows/${app}-workflow.yml/dispatches \
              -d '{"ref": "main", "inputs": {"branch": "'"${{ github.event.inputs.branch }}"'"}}'
          done
