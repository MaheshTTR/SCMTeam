name: KeyCite-Releases

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Enter Environment'
        required: true

jobs:
  process-applications:
    runs-on: ubuntu-latest

    steps:
      # Checkout the current repository
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      # Fetch release.xml from WestLaw_Cody repository
      - name: Checkout WestLaw_Cody Repository
        uses: actions/checkout@v4
        with:
          repository: tr/WestLaw_Cody
          token: ${{ secrets.SCM_GITTOKEN }}
          path: ${{ github.workspace }}/WestLaw_Cody
         
      - name: list the files
        run: |
           ls -alR
          
      # Set up Groovy
      - name: Set up Groovy
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'
          
      - name: Install Groovy
        run: sudo apt-get install -y groovy

      # Run Groovy script to generate apps.properties
      - name: Parse  WestLaw_Cody/CodeFreeze/ReleaseJenkins.xml
        run: groovy .github/parse_release.groovy ${{ github.workspace }}/WestLaw_Cody/Releases/Dev/KeyCiteReleasesApps.xml

      # # Create application-to-repository map
      # - name: Create App-Repository Map
      #   id: create-map
      #   run: |
      #     cat <<EOF > apps-to-repos.properties
      #     KCCMController=tr/kc-publishing_KCCMControllerV2
      #     KCPBWeb=tr/kc-publishing_KCPBWeb
      #     KCPBMdhCleanup=tr/kc-publishing_CleanupJobs_KCPBMdhCleanup
      #     # Add all app-to-repo mappings here
      #     EOF
      # Read apps.properties and apps-to-repos.properties to trigger workflows
      - name: Trigger Application Workflows
        run: |
          # Read all applications from apps.properties
          echo "Reading apps.properties..."
          apps=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^=]+)=true$ ]]; then
              app=${BASH_REMATCH[1]}
              apps="${apps},$app"
            fi
          done < apps.properties
          apps=${apps#,}
          echo "Applications to process: $apps"
          IFS=',' read -r -a appArray <<< "$apps"
          
            # Initialize a variable to track failures
            overall_status=0

          # Loop through each application and trigger corresponding repository workflow
          for app in "${appArray[@]}"; do
            echo "Processing $app..."
            repo=$(grep "^$app=" .github/config/apps-to-repos.properties | cut -d'=' -f2)
            version=$(grep "^${app}_version=" apps.properties | cut -d'=' -f2)
            echo version=$version
            if [[ -z "$repo" ]]; then
              echo "Repository not found for application $app. Skipping..."
              continue
            fi
          
            echo "Triggering workflow for $app in repository $repo with version $version"
            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/$repo/actions/workflows/${app}-Dev-Test-QA-Deploy.yml/dispatches \
              -d '{"ref": "main", "inputs": {"environment": "'"${{ github.event.inputs.environment }}"'", "build_ver": "'"$version"'"}}'
          
            # Poll for workflow completion
             timeout=1800
            start_time=$(date +%s)
            
            while true; do
              current_time=$(date +%s)
              elapsed_time=$((current_time - start_time))
              
              if [[ $elapsed_time -ge $timeout ]]; then
                echo "Timeout reached for $app. Marking as failed."
                overall_status=1
                break
              fi
            
              # Fetch the run ID
              run_id=$(curl -s -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$repo/actions/runs?branch=main | jq -r '.workflow_runs[0].id')
            
              if [[ -z "$run_id" ]]; then
                echo "Failed to retrieve run ID for $app. Marking as failed."
                overall_status=1
                break
              fi
            
              # Check workflow status and conclusion
              status=$(curl -s -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$repo/actions/runs/$run_id | jq -r '.status')
            
              conclusion=$(curl -s -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$repo/actions/runs/$run_id | jq -r '.conclusion')
            
              echo "Current status for $app: $status"
            
              if [[ "$status" == "completed" ]]; then
                echo "Workflow for $app completed with conclusion: $conclusion"
                if [[ "$conclusion" != "success" ]]; then
                  echo "Child workflow failed for $app with conclusion: $conclusion"
                  overall_status=1
                else
                  echo "Child workflow succeeded for $app."
                fi
                break
              fi
              sleep 15
            done
          done
          
          # Check overall status and exit accordingly
          if [[ $overall_status -ne 0 ]]; then
            echo "One or more child workflows failed."
            exit 1
          else
            echo "All child workflows succeeded."
          fi
