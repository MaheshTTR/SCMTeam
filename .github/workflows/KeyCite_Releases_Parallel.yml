name: KeyCite-Releases-Parallel

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Enter Environment'
        required: true

jobs:
  process-applications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Checkout WestLaw_Cody Repository
        uses: actions/checkout@v4
        with:
          repository: tr/WestLaw_Cody
          token: ${{ secrets.SCM_GITTOKEN }}
          path: ${{ github.workspace }}/WestLaw_Cody

      - name: List the files
        run: ls -alR

      - name: Set up Java and Groovy
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Install Groovy
        run: sudo apt-get install -y groovy

      - name: Parse Release XML
        run: groovy .github/parse_release.groovy ${{ github.workspace }}/WestLaw_Cody/Releases/Dev/KeyCiteReleasesApps.xml

      - name: Trigger Application Workflows in Parallel
        run: |
          echo "Reading apps.properties..."
          apps=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^=]+)=true$ ]]; then
              app=${BASH_REMATCH[1]}
              apps="${apps},$app"
            fi
          done < apps.properties
          apps=${apps#,}
          echo "Applications to process: $apps"
          IFS=',' read -r -a appArray <<< "$apps"

            overall_status=0
            declare -A process_pids
            
            # Function to monitor a single workflow
            monitor_workflow() {
              local app=$1
              local repo=$2
              local version=$3
              local environment=$4
              local run_id
              local status
              local conclusion
              local last_status=""
              local start_time=$(date +%s)
              local timeout=1800
              
              echo "Triggering workflow for $app in repository $repo..."
            
              # Trigger the workflow
              curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$repo/actions/workflows/${app}-Dev-Test-QA-Deploy.yml/dispatches \
                -d '{"ref": "main", "inputs": {"environment": "'"$environment"'", "build_ver": "'"$version"'"}}'
            
              # Wait briefly to allow the workflow to register
              sleep 10
            
              # Fetch the workflow `run_id`
              run_id=$(curl -s -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$repo/actions/runs?branch=main | jq -r \
                '.workflow_runs[] | select(.event == "workflow_dispatch" and .head_branch == "main") | .id' | head -n 1)
            
              if [[ -z "$run_id" ]]; then
                echo "Failed to retrieve run ID for $app. Skipping..."
                return 1
              fi
            
              echo "Monitoring workflow run ID: $run_id for $app."
            
              # Monitor the workflow status
              while true; do
                local current_time=$(date +%s)
                local elapsed_time=$((current_time - start_time))
            
                if [[ $elapsed_time -ge $timeout ]]; then
                  echo "Timeout reached for $app. Marking as failed."
                  return 1
                fi
            
                status=$(curl -s -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/$repo/actions/runs/$run_id | jq -r '.status')
            
                conclusion=$(curl -s -H "Authorization: Bearer ${{ secrets.SCM_GITTOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/$repo/actions/runs/$run_id | jq -r '.conclusion')
            
                if [[ "$status" != "$last_status" ]]; then
                  echo "Current status for $app: $status"
                  last_status="$status"
                fi
            
                if [[ "$status" == "completed" ]]; then
                  echo "Workflow for $app completed with conclusion: $conclusion"
                  if [[ "$conclusion" != "success" ]]; then
                    echo "Child workflow failed for $app with conclusion: $conclusion"
                    return 1
                  else
                    echo "Child workflow succeeded for $app."
                    return 0
                  fi
                fi
            
                sleep 15
              done
            }
            
            # # Main loop to process apps in parallel
            # apps="KCCMController,KCPBWeb,KCPBMdhCleanup"
            # IFS=',' read -r -a appArray <<< "$apps"
            
            # for app in "${appArray[@]}"; do
            #   repo=$(grep "^$app=" .github/config/apps-to-repos.properties | cut -d'=' -f2)
            #   version=$(grep "^${app}_version=" apps.properties | cut -d'=' -f2)
            #   environment="${{ github.event.inputs.environment }}"
            
            #   if [[ -z "$repo" ]]; then
            #     echo "Repository not found for application $app. Skipping..."
            #     continue
            #   fi
            
            #   # Run monitor_workflow in the background
            #   monitor_workflow "$app" "$repo" "$version" "$environment" &
            #   process_pids["$app"]=$!
            # done
            # Main loop to process apps in parallel
            apps=""
            while IFS= read -r line; do
              if [[ "$line" =~ ^([^=]+)=true$ ]]; then
                app=${BASH_REMATCH[1]}
                apps="${apps},$app"
              fi
            done < apps.properties
            
            # Remove the leading comma from the list
            apps=${apps#,}
            
            # Split the apps into an array
            IFS=',' read -r -a appArray <<< "$apps"
            
            # Process each application
            for app in "${appArray[@]}"; do
              repo=$(grep "^$app=" .github/config/apps-to-repos.properties | cut -d'=' -f2)
              version=$(grep "^${app}_version=" apps.properties | cut -d'=' -f2)
              environment="${{ github.event.inputs.environment }}"
            
              if [[ -z "$repo" ]]; then
                echo "Repository not found for application $app. Skipping..."
                continue
              fi
            
              # Run monitor_workflow in the background
              monitor_workflow "$app" "$repo" "$version" "$environment" &
              process_pids["$app"]=$!
            done

            # Wait for all background processes to complete
            for app in "${!process_pids[@]}"; do
              pid=${process_pids[$app]}
              wait $pid
              if [[ $? -ne 0 ]]; then
                overall_status=1
                echo "Workflow for $app failed or timed out."
              else
                echo "Workflow for $app completed successfully."
              fi
            done
            
            exit $overall_status
